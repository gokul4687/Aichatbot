<!DOCTYPE html>
<html>
<head>
    <title>Gokul's AI Chatbot</title>
</head>

<body>
    <h1>🤖 Gokul's AI Chatbot</h1>

    <form method="POST">
        <input
            type="text"
            name="message"
            placeholder="Ask me anything..."
            required>

        <button type="submit">
            Send
        </button>
    </form>

    {% if response %}
        <hr>

        <h3>Bot:</h3>

        <p>{{ response }}</p>
    {% endif %}

</body>
</html>
